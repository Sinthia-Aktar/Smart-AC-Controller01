<input type="number" id="temperature" placeholder="Temperature">
<input type="number" id="humidity" placeholder="Humidity">

<input type="number" id="target" value="24">

<button onclick="autoControl()">
    AUTO CONTROL
</button>

<h3>Fan Speed: <span id="fanSpeed">--</span></h3>
<h3>Fan Mode: <span id="fanMode">--</span></h3>

<h3>Room Temperature: <span id="roomTemp">--</span></h3>
<h3>Humidity: <span id="roomHumidity">--</span></h3>
<h3>Target: <span id="targetTemp">--</span></h3>

<h3>Cooling: <span id="cooling">--</span></h3>
<h3>Comfort: <span id="comfort">--</span></h3>

<div style="background:#ddd; width:100%; height:15px;">
    <div id="progress"
         style="background:green; width:0%; height:15px;">
    </div>
</div>
